# Curated corpus: Wikipedia articles about space exploration.
# `category` is editorial metadata used only to colour points in the 2D map;
# positions come from the embeddings, so clusters emerge on their own.
# Run `uv run ragview fetch` to (re)download; the fetched revision ids are
# written to corpus/ATTRIBUTION.md.
license: CC BY-SA 4.0
max_words: 1500
categories:
  bodies: Planets & moons
  robotic: Robotic missions
  crewed: Crewed spaceflight
  rockets: Launch vehicles
  people: People
documents:
