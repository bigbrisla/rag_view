[project]
name = "ragview"
version = "0.1.0"
description = "Offline ingestion, reference RAG pipeline and evaluation for RAGView."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
  "numpy>=2.0",
  "onnxruntime>=1.20",
  "tokenizers>=0.20",
  "huggingface-hub>=0.26",
  "umap-learn>=0.5.7",
  "httpx[http2]>=0.27",
  "pyyaml>=6.0",
]

[project.scripts]
ragview = "ragview.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragview"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length is the formatter's job

[tool.pytest.ini_options]
testpaths = ["tests"]
